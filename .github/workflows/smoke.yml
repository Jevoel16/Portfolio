name: Production smoke test

# Vercel deploys on push through its Git integration and reports back as a commit status named "Vercel"
# (not a GitHub deployment), so this listens for that status turning green on a commit in main.
on:
  status:
  schedule:
    - cron: '0 6 * * 1' # every Monday, to catch domain or DNS changes made outside the repo
  workflow_dispatch:
    inputs:
      url:
        description: Base URL to check
        default: https://www.jevoelorbilla.dev

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test the live site
    if: >-
      github.event_name != 'status' ||
      (github.event.context == 'Vercel' && github.event.state == 'success' &&
       contains(github.event.branches.*.name, 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Run smoke checks
        run: node scripts/smoke.mjs "${{ inputs.url || 'https://www.jevoelorbilla.dev' }}"
