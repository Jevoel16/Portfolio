name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Audit, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

      - name: Type-check, build and prerender
        run: npm run build

      - name: Check build output
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/llms.txt
          # The apex host only redirects to www, so no generated URL may point at it.
          if grep -rl "https://jevoelorbilla.dev" dist; then
            echo "::error::build output links to the apex domain instead of www"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
